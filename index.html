<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Libros</title>
    <!-- Importación de Chart.js vía CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .grafica-container { width: 60%; margin: auto; }
    </style>
</head>
<body>

    <h1>Catálogo de Libros</h1>

    <!-- Contenedor para mostrar los registros en tabla -->
    <div id="tabla-datos">
        <table id="tabla-libros">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre del Libro</th>
                    <th>Autor</th>
                </tr>
            </thead>
            <tbody>
                <!-- Las filas se inyectarán dinámicamente con JS -->
            </tbody>
        </table>
    </div>

    <!-- Elemento canvas donde se renderizará el gráfico -->
    <div class="grafica-container">
        <canvas id="miGrafica"></canvas>
    </div>

    <!-- Importar la lógica de JavaScript -->
    <script src="app.js"></script>
</body>
</html>
